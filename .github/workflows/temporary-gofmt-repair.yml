name: Temporary gofmt repair
on:
  push:
    branches:
      - fix/auto-warp-enrollment-port-recovery-backup-20261020
    paths:
      - .github/workflows/temporary-gofmt-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/auto-warp-enrollment-port-recovery-backup-20261020
          persist-credentials: true
      - name: Apply only gofmt to newly added or changed Go sources
        run: |
          gofmt -w cmd/ktest/listener_recovery.go cmd/ktest/listener_recovery_test.go cmd/ktest/connect.go internal/aether/backup.go internal/aether/backup_test.go mobilebridge/aether_backup.go mobilebridge/automatic_exit.go mobilebridge/native.go mobilebridge/native_enrollment.go cmd/ktest/warp_backup.go cmd/ktest/warp.go cmd/ktest/modes.go cmd/ktest/warp_manager.go internal/aether/identity.go
          git add -- cmd/ktest/listener_recovery.go cmd/ktest/listener_recovery_test.go cmd/ktest/connect.go internal/aether/backup.go internal/aether/backup_test.go mobilebridge/aether_backup.go mobilebridge/automatic_exit.go mobilebridge/native.go mobilebridge/native_enrollment.go cmd/ktest/warp_backup.go cmd/ktest/warp.go cmd/ktest/modes.go cmd/ktest/warp_manager.go internal/aether/identity.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format WARP recovery and Android backup Go implementation"
            git push origin HEAD:refs/heads/fix/auto-warp-enrollment-port-recovery-backup-20261020
          fi
