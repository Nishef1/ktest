name: Temporary Aether Go formatting
on:
  push:
    branches: [feat/aether-v232-atomic-upgrades-20261021]
    paths: [.github/workflows/temporary-aether-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/aether-v232-atomic-upgrades-20261021
          persist-credentials: true
      - name: Apply gofmt to changed Go sources
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/ktest/warp.go cmd/ktest/warp_test.go cmd/ktest/warp_manager.go internal/aether/desktop_bundle.go internal/aether/desktop_bundle_test.go
          python3 -m py_compile android/scripts/update-aether-release.py android/scripts/prepare-native-cores.py
          git add -- cmd/ktest/warp.go cmd/ktest/warp_test.go cmd/ktest/warp_manager.go internal/aether/desktop_bundle.go internal/aether/desktop_bundle_test.go
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format versioned Aether updater and tests"
            git push origin HEAD:refs/heads/feat/aether-v232-atomic-upgrades-20261021
          fi
