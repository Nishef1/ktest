name: windows-portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify source and build
        shell: pwsh
        run: |
          # Full Go tests/vet run in the separate 'verify' workflow. Build and
          # native Windows smoke tests are sufficient for this packaging job.
          New-Item -ItemType Directory -Force -Path portable/ktest/cores, portable/ktest/profiles, portable/ktest/THIRD_PARTY, build/xray, build/byedpi, build/singbox, build/wintun | Out-Null
          go build -trimpath -o portable/ktest/ktest.exe ./cmd/ktest
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Download and verify official cores
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function DownloadVerified([string]$url, [string]$path, [string]$sha256) {
            Invoke-WebRequest -Uri $url -OutFile $path -MaximumRedirection 8
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $sha256) { throw "SHA-256 mismatch for $path" }
          }
          DownloadVerified "https://github.com/XTLS/Xray-core/releases/download/v26.10.10/Xray-windows-64.zip" "build/xray.zip" "bfefce8e9804e53b7d75b7c49d958b34e89890d9d5e672329089d1b3111647af"
          Expand-Archive -LiteralPath build/xray.zip -DestinationPath build/xray -Force
          $xray = Get-ChildItem -Path build/xray -Filter xray.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $xray) { throw "Official Xray zip did not contain xray.exe" }
          Copy-Item $xray.FullName portable/ktest/cores/xray.exe
          foreach ($name in @("geoip.dat", "geosite.dat")) {
            $asset = Get-ChildItem -Path build/xray -Filter $name -File -Recurse | Select-Object -First 1
            if ($null -eq $asset) { throw "Missing Xray asset $name in official release" }
            Copy-Item $asset.FullName (Join-Path portable/ktest/cores $name)
          }
          DownloadVerified "https://github.com/hufrea/byedpi/releases/download/v0.17.3/byedpi-17.3-x86_64-w64.zip" "build/byedpi.zip" "70d2c94147193cb915f9c6eb5144b8d404dacbcfa90bda2383b6b211afafa456"
          Expand-Archive -LiteralPath build/byedpi.zip -DestinationPath build/byedpi -Force
          $bye = Get-ChildItem -Path build/byedpi -Filter ciadpi.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $bye) { throw "Official ByeDPI zip did not contain ciadpi.exe" }
          Copy-Item $bye.FullName portable/ktest/cores/ciadpi.exe
          DownloadVerified "https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-windows-amd64.zip" "build/singbox.zip" "d8b86ef58936dba9230ec6a57ffa4243933f3c14ef4809828b6c553440ed1518"
          Expand-Archive -LiteralPath build/singbox.zip -DestinationPath build/singbox -Force
          $sb = Get-ChildItem -Path build/singbox -Filter sing-box.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $sb) { throw "Official sing-box zip did not contain sing-box.exe" }
          Copy-Item $sb.FullName portable/ktest/cores/sing-box.exe
          DownloadVerified "https://www.wintun.net/builds/wintun-0.14.1.zip" "build/wintun.zip" "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          Expand-Archive -LiteralPath build/wintun.zip -DestinationPath build/wintun -Force
          $driver = "build/wintun/wintun/bin/amd64/wintun.dll"
          if (-not (Test-Path $driver)) { throw "Official Wintun AMD64 signed DLL missing" }
          Copy-Item $driver portable/ktest/cores/wintun.dll
          DownloadVerified "https://github.com/CluvexStudio/Aether/releases/download/v2.3.0/aether-windows-x86_64.zip" "build/aether.zip" "0cc32dd2d7573f91d2e55d4f427bfe4c6f6252342494e1b410d61b12d1e4dc79"
          Expand-Archive -LiteralPath build/aether.zip -DestinationPath build/aether -Force
          $ae = Get-ChildItem -Path build/aether -Filter aether.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ae) { throw "Official Aether zip did not contain aether.exe" }
          Copy-Item $ae.FullName portable/ktest/cores/aether.exe
          $pt = Get-ChildItem -Path build/aether -Directory -Filter pt -Recurse | Select-Object -First 1
          if ($null -eq $pt) { throw "Official Aether zip did not contain the pt folder" }
          New-Item -ItemType Directory -Force -Path portable/ktest/cores/pt | Out-Null
          Copy-Item (Join-Path $pt.FullName "psiphon-tunnel-core.exe") portable/ktest/cores/pt/psiphon-tunnel-core.exe
          Copy-Item (Join-Path $pt.FullName "lyrebird.exe") portable/ktest/cores/pt/lyrebird.exe
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/CluvexStudio/Aether/v2.3.0/LICENSE" -OutFile portable/ktest/THIRD_PARTY/Aether-AGPL-3.0.txt
          Copy-Item "build/wintun/wintun/LICENSE.txt" portable/ktest/THIRD_PARTY/Wintun-LICENSE.txt
      - name: Pin the offline profile and ship licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rev = "19e394313afd347ca0935bea0def25522434dbe6"
          $url = "https://raw.githubusercontent.com/patterniha/Serverless-for-Iran/$rev/Subscription/Serverless-for-Iran.json"
          Invoke-WebRequest -Uri $url -OutFile portable/ktest/profiles/Serverless-for-Iran.json
          $blob = (git hash-object portable/ktest/profiles/Serverless-for-Iran.json).Trim()
          if ($LASTEXITCODE -ne 0 -or $blob -ne "ab1dd41508e073df841dfa781969550bbdd20927") {
            throw "Upstream profile content does not match pinned Git blob"
          }
          $profile = Get-Content -LiteralPath portable/ktest/profiles/Serverless-for-Iran.json -Raw | ConvertFrom-Json
          foreach ($v in @("A","B")) {
            $selected = "build/selected-frag$v.json"
            & ./portable/ktest/ktest.exe profile-preview -profile portable/ktest/profiles/Serverless-for-Iran.json $v |
              Set-Content -LiteralPath $selected -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "Profile $v generation failed" }
            $env:XRAY_LOCATION_ASSET = (Resolve-Path portable/ktest/cores).Path
            & ./portable/ktest/cores/xray.exe run -test -c $selected
            if ($LASTEXITCODE -ne 0) { throw "Xray rejected ktest patched Fragment $v" }
            foreach ($dnsTransport in @("udp","tcp")) {
              $selectedDNS = "build/selected-frag$v-$dnsTransport.json"
              & ./portable/ktest/ktest.exe profile-preview -profile portable/ktest/profiles/Serverless-for-Iran.json $v $dnsTransport |
                Set-Content -LiteralPath $selectedDNS -Encoding utf8
              if ($LASTEXITCODE -ne 0) { throw "Profile $v with $dnsTransport failed generation" }
              & ./portable/ktest/cores/xray.exe run -test -c $selectedDNS
              if ($LASTEXITCODE -ne 0) { throw "Xray rejected profile $v with $dnsTransport DNS" }
            }
          }
          if (@($profile).Count -ne 2 -or
              (@($profile | Where-Object { $_.remarks -like '*fragA' })).Count -ne 1 -or
              (@($profile | Where-Object { $_.remarks -like '*fragB' })).Count -ne 1) {
            throw "Unexpected serverless profile structure"
          }
          & ./portable/ktest/ktest.exe strategies -write
          if ($LASTEXITCODE -ne 0) { throw "Could not write the editable ByeDPI strategy list" }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/XTLS/Xray-core/v26.10.10/LICENSE" -OutFile portable/ktest/THIRD_PARTY/Xray-MPL-2.0.txt
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/hufrea/byedpi/v0.17.3/LICENSE" -OutFile portable/ktest/THIRD_PARTY/ByeDPI-MIT.txt
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/patterniha/Serverless-for-Iran/$rev/LICENSE" -OutFile portable/ktest/THIRD_PARTY/Serverless-GPL-3.0.txt
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/SagerNet/sing-box/v1.14.3/LICENSE" -OutFile portable/ktest/THIRD_PARTY/sing-box-GPL-3.0.txt
          Copy-Item docs/THIRD_PARTY_NOTICES.md portable/ktest/THIRD_PARTY/NOTICES.md
      - name: Windows smoke tests and portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $menu = "0`n" | & ./portable/ktest/ktest.exe
          $menuText = $menu -join "`n"
          if ($LASTEXITCODE -ne 0 -or $menuText -notmatch "(?i)Disconnected" -or $menuText -notmatch "Connect with") {
            throw "Terminal menu did not start and exit cleanly"
          }
          $version = & ./portable/ktest/cores/xray.exe version
          if ($LASTEXITCODE -ne 0 -or (($version -join "`n") -notmatch "Xray 26\.10\.10")) {
            throw "Bundled Xray did not start or returned unexpected version"
          }
          $sb = & ./portable/ktest/cores/sing-box.exe version
          if ($LASTEXITCODE -ne 0 -or (($sb -join "`n") -notmatch "1\.14\.3")) {
            throw "Bundled sing-box failed native Windows version check"
          }
          & ./portable/ktest/ktest.exe tun-preview | Set-Content -Encoding utf8 build/tun-preview.json
          if ($LASTEXITCODE -ne 0) { throw "TUN config generator failed" }
          & ./portable/ktest/cores/sing-box.exe check -c build/tun-preview.json
          if ($LASTEXITCODE -ne 0) { throw "sing-box rejected generated TUN config" }
          Compress-Archive -Path portable/ktest -DestinationPath ktest-windows-portable.zip -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 ktest-windows-portable.zip).Hash.ToLowerInvariant() + "  ktest-windows-portable.zip" | Set-Content -Encoding ascii ktest-windows-portable.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ktest-windows-portable
          path: |
            ktest-windows-portable.zip
            ktest-windows-portable.zip.sha256
          retention-days: 14
          if-no-files-found: error
