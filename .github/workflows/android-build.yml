name: Android foundation
on:
  push:
    paths:
      - "android/**"
      - "mobilebridge/**"
      - "internal/pathdiag/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "mobilebridge/**"
      - "internal/pathdiag/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Validate Go mobile API
        run: |
          go test ./mobilebridge ./internal/pathdiag
          test -z "$(gofmt -l mobilebridge)"
      - name: Build Go mobile AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi=26 -o android/app/libs/mobilebridge.aar ./mobilebridge
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: ktest-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
