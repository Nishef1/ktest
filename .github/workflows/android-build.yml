# Manual runs and scoped changes on main build previews as Actions artifacts.
# Production signing and release publication remain separate.
name: Android APK (ARMv8 preview)
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (versionName), for example 0.5.0-preview
        type: string
        required: true
      version_code:
        description: Monotonic Android versionCode
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "android/app/**"
      - "android/scripts/**"
      - "mobilebridge/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require and prepare dedicated preview signer
        shell: bash
        env:
          KTEST_PREVIEW_KEYSTORE_BASE64: ${{ secrets.KTEST_PREVIEW_KEYSTORE_BASE64 }}
          KTEST_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.KTEST_PREVIEW_KEYSTORE_PASSWORD }}
          KTEST_PREVIEW_KEY_ALIAS: ${{ secrets.KTEST_PREVIEW_KEY_ALIAS }}
          KTEST_PREVIEW_KEY_PASSWORD: ${{ secrets.KTEST_PREVIEW_KEY_PASSWORD }}
          KTEST_PREVIEW_CERT_SHA256: ${{ secrets.KTEST_PREVIEW_CERT_SHA256 }}
        run: |
          set +x
          set -euo pipefail
          MISSING=0
          for NAME in KTEST_PREVIEW_KEYSTORE_BASE64 KTEST_PREVIEW_KEYSTORE_PASSWORD KTEST_PREVIEW_KEY_ALIAS KTEST_PREVIEW_KEY_PASSWORD KTEST_PREVIEW_CERT_SHA256; do
            if [[ -z "${!NAME:-}" ]]; then
              printf '::error::Missing required repository secret %s\n' "$NAME"
              MISSING=1
            fi
          done
          [[ "$MISSING" -eq 0 ]] || exit 1
          EXPECTED_SHA256="$(printf '%s' "$KTEST_PREVIEW_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Preview certificate fingerprint must be a SHA-256 digest.'
            exit 1
          fi
          umask 077
          SIGNING_DIR="$(mktemp -d "$RUNNER_TEMP/ktest-preview-signing.XXXXXXXX")"
          SIGNING_PATH="$SIGNING_DIR/preview.p12"
          printf 'KTEST_PREVIEW_KEYSTORE_PATH=%s\n' "$SIGNING_PATH" >> "$GITHUB_ENV"
          if ! printf '%s' "$KTEST_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_PATH"; then
            echo '::error::Preview keystore is not valid base64.'
            exit 1
          fi
          if [[ ! -s "$SIGNING_PATH" ]]; then
            echo '::error::Preview keystore is empty.'
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Resolve APK version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          # Direct pushes keep the defaults in build.gradle.kts; the release
          # workflow passes an explicit version so the APK says which build it is.
          NAME="${INPUT_VERSION:-$(sed -n 's/.*orNull ?: "\(.*\)"$/\1/p' android/app/build.gradle.kts | head -n 1)}"
          CODE="${INPUT_CODE:-$(sed -n 's/.*toInt() ?: \([0-9]*\)$/\1/p' android/app/build.gradle.kts | head -n 1)}"
          [[ -n "$NAME" && "$CODE" =~ ^[0-9]+$ ]] || { echo '::error::Cannot resolve APK version.'; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "APK version: $NAME ($CODE)"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Validate Go mobile API
        run: |
          gofmt -w mobilebridge
          go test ./mobilebridge ./internal/pathdiag
      - name: Build Go mobile AAR
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          MOBILE_VERSION=v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION
          go get -tool golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi=26 -o android/app/libs/mobilebridge.aar ./mobilebridge
      - name: Fetch pinned HEV Android tun2socks adapter
        run: bash android/scripts/fetch-hev-aar.sh
      - name: Prepare pinned official native cores
        run: python3 android/scripts/prepare-native-cores.py --abis arm64-v8a
      - name: Build Android preview APK (dedicated preview signer, internal testing only)
        env:
          KTEST_REQUIRE_PREVIEW_SIGNING: 'true'
          KTEST_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.KTEST_PREVIEW_KEYSTORE_PASSWORD }}
          KTEST_PREVIEW_KEY_ALIAS: ${{ secrets.KTEST_PREVIEW_KEY_ALIAS }}
          KTEST_PREVIEW_KEY_PASSWORD: ${{ secrets.KTEST_PREVIEW_KEY_PASSWORD }}
        run: gradle -p android :app:assembleDebug -PktestAbis=arm64-v8a -PktestVersionName="${{ steps.version.outputs.name }}" -PktestVersionCode="${{ steps.version.outputs.code }}" --no-daemon --no-configuration-cache
      - name: Verify APK preview signing certificate
        shell: bash
        env:
          KTEST_PREVIEW_CERT_SHA256: ${{ secrets.KTEST_PREVIEW_CERT_SHA256 }}
        run: |
          set +x
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if ! CERT_REPORT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" 2>&1)"; then
            echo '::error::Preview APK signature verification failed.'
            exit 1
          fi
          mapfile -t CERT_DIGESTS < <(printf '%s\n' "$CERT_REPORT" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')
          if [[ "${#CERT_DIGESTS[@]}" -ne 1 ]]; then
            echo '::error::Preview APK must have exactly one signing certificate.'
            exit 1
          fi
          ACTUAL_SHA256="$(printf '%s' "${CERT_DIGESTS[0]}" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="$(printf '%s' "$KTEST_PREVIEW_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ || "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo '::error::Preview APK signing certificate does not match the configured signer.'
            exit 1
          fi
          echo 'Preview APK signing certificate matches the configured signer.'
      - name: Verify APK signature, ABIs, and package
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.nishef.ktest'"
          echo "$BADGING" | grep -F "versionCode='${{ steps.version.outputs.code }}'"
          echo "$BADGING" | grep -F "versionName='${{ steps.version.outputs.name }}'"
          unzip -t "$APK" | tail -n 1
          test "$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\/[^/]+$/ {print $2}' | sort -u)" = arm64-v8a
          for ABI in arm64-v8a; do
            unzip -Z1 "$APK" | grep -Fx "lib/$ABI/libgojni.so"
            unzip -Z1 "$APK" | grep -Fx "lib/$ABI/libhev-socks5-tunnel.so"
            for CORE in aether psiphon-tunnel-core lyrebird ciadpi xray; do
              unzip -Z1 "$APK" | grep -Fx "lib/$ABI/lib$CORE.so"
            done
          done
          python3 android/scripts/prepare-native-cores.py --abis arm64-v8a --verify-apk "$APK"
          mkdir -p android/dist
          cp "$APK" "android/dist/KTest-Connection-android-arm64-v8a-v${{ steps.version.outputs.name }}.apk"
          sha256sum android/dist/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: KTest-Connection-android-arm64-v8a-v${{ steps.version.outputs.name }}
          path: android/dist/KTest-Connection-android-arm64-v8a-v${{ steps.version.outputs.name }}.apk
          retention-days: 14
          if-no-files-found: error
      - name: Remove temporary preview signer
        if: always()
        shell: bash
        run: |
          set +x
          set -euo pipefail
          if [[ -n "${KTEST_PREVIEW_KEYSTORE_PATH:-}" ]]; then
            case "$KTEST_PREVIEW_KEYSTORE_PATH" in
              "$RUNNER_TEMP"/ktest-preview-signing.*/preview.p12)
                rm -f -- "$KTEST_PREVIEW_KEYSTORE_PATH"
                rmdir -- "$(dirname "$KTEST_PREVIEW_KEYSTORE_PATH")"
                ;;
              *) echo '::error::Refusing an unexpected preview signing cleanup path.'; exit 1 ;;
            esac
          fi
