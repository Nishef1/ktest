# Android preview builds are normally manual and uploaded as Actions artifacts.
# A workflow-file update also triggers a preview build on main (not production publication).
# Production signing and release publication remain separate.
name: Android APK (ARMv8 preview)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "android/app/**"
      - "mobilebridge/**"
      - "internal/front/**"
      - "internal/quickcheck/**"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Validate Go mobile API
        run: |
          gofmt -w mobilebridge
          go test ./mobilebridge ./internal/pathdiag
      - name: Build Go mobile AAR
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          MOBILE_VERSION=v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION
          go get -tool golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi=26 -o android/app/libs/mobilebridge.aar ./mobilebridge
      - name: Fetch pinned HEV Android tun2socks adapter
        run: bash android/scripts/fetch-hev-aar.sh
      - name: Inspect official Xray ARMv8 candidate
        run: python3 android/scripts/inspect-xray.py
      - name: Prepare pinned official native cores
        run: python3 android/scripts/prepare-native-cores.py --abis arm64-v8a
      - name: Build Android preview APK (debug-signed, internal testing only)
        run: gradle -p android :app:assembleDebug -PktestAbis=arm64-v8a --no-daemon
      - name: Verify APK signature, ABIs, and package
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "versionCode='10'"
          echo "$BADGING" | grep -F "versionName='0.3.2-preview'"
          unzip -t "$APK" | tail -n 1
          test "$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\/[^/]+$/ {print $2}' | sort -u)" = arm64-v8a
          for ABI in arm64-v8a; do
            unzip -Z1 "$APK" | grep -Fx "lib/$ABI/libgojni.so"
            unzip -Z1 "$APK" | grep -Fx "lib/$ABI/libhev-socks5-tunnel.so"
            for CORE in aether psiphon-tunnel-core lyrebird ciadpi; do
              unzip -Z1 "$APK" | grep -Fx "lib/$ABI/lib$CORE.so"
            done
          done
          python3 android/scripts/prepare-native-cores.py --abis arm64-v8a --verify-apk "$APK"
          mkdir -p android/dist
          cp "$APK" android/dist/KTest-Connection-android-arm64-v8a-preview.apk
          sha256sum android/dist/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: KTest-Connection-android-arm64-v8a-preview
          path: android/dist/KTest-Connection-android-arm64-v8a-preview.apk
          retention-days: 14
          if-no-files-found: error
