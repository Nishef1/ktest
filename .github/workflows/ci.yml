name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download pinned PattNG Xray parser for generated Android config checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "xray-windows-26.11.1.zip"
          $dest = Join-Path $env:RUNNER_TEMP "xray-windows-26.11.1"
          Invoke-WebRequest -Uri "https://github.com/patterniha/Xray-core/releases/download/v26.11.1/Xray-windows-64.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne "9f7cfd2f14a4974339de3e0a8fd23447e7bb8a0e04c2df10cd324d188947032c") {
            throw "PattNG Xray archive SHA-256 mismatch"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $xray = Get-ChildItem -Path $dest -Filter xray.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $xray) { throw "PattNG Xray archive did not contain xray.exe" }
          foreach ($name in @("geoip.dat", "geosite.dat")) {
            $asset = Get-ChildItem -Path $dest -Filter $name -File -Recurse | Select-Object -First 1
            if ($null -eq $asset) { throw "PattNG Xray archive did not contain $name" }
            if (-not [string]::Equals($asset.DirectoryName, $xray.DirectoryName, [StringComparison]::OrdinalIgnoreCase)) {
              Copy-Item -LiteralPath $asset.FullName -Destination (Join-Path $xray.DirectoryName $name) -Force
            }
          }
          "KTEST_XRAY_BIN=$($xray.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ktest
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -d cmd internal mobilebridge && test -z "$(gofmt -l cmd internal mobilebridge)"
  android-source:
    # Compile source/API contracts on every change without generating APK/AAR
    # or running the manually gated native/release workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Install source compilation SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36"
      - name: Compile Android source without native or APK artifacts
        run: bash android/scripts/check-sources.sh
      - name: Compile Go bridge package for Android arm64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build ./mobilebridge
