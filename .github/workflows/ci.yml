name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download pinned official Xray parser for generated Android config checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "xray-windows-26.10.10.zip"
          $dest = Join-Path $env:RUNNER_TEMP "xray-windows-26.10.10"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.10.10/Xray-windows-64.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne "bfefce8e9804e53b7d75b7c49d958b34e89890d9d5e672329089d1b3111647af") {
            throw "Official Xray archive SHA-256 mismatch"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $xray = Get-ChildItem -Path $dest -Filter xray.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $xray) { throw "Official Xray archive did not contain xray.exe" }
          foreach ($name in @("geoip.dat", "geosite.dat")) {
            $asset = Get-ChildItem -Path $dest -Filter $name -File -Recurse | Select-Object -First 1
            if ($null -eq $asset) { throw "Official Xray archive did not contain $name" }
            if (-not [string]::Equals($asset.DirectoryName, $xray.DirectoryName, [StringComparison]::OrdinalIgnoreCase)) {
              Copy-Item -LiteralPath $asset.FullName -Destination (Join-Path $xray.DirectoryName $name) -Force
            }
          }
          "KTEST_XRAY_BIN=$($xray.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ktest
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -d cmd internal mobilebridge && test -z "$(gofmt -l cmd internal mobilebridge)"
  android-source:
    # Compile source/API contracts on every change without generating APK/AAR
    # or running the manually gated native/release workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Install source compilation SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36"
      - name: Compile Android source without native or APK artifacts
        run: bash android/scripts/check-sources.sh
      - name: Compile Go bridge package for Android arm64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build ./mobilebridge
  binaries:
    # Keep downloadable binaries on main only. Feature-branch development
    # should run tests/vet/race, not generate release-like artifacts.
    # The user requested no distributable build artifacts until Android
    # feature parity and device validation are complete. Tests still run.
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/ktest-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/ktest
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ktest-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
