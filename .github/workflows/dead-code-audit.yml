name: Temporary dead-code report
on:
  push:
    paths:
      - .github/workflows/dead-code-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: List statically unreachable Go functions including test roots
        run: |
          go run golang.org/x/tools/cmd/deadcode@v0.39.0 -test ./... > /tmp/deadcode.txt
          head -150 /tmp/deadcode.txt
