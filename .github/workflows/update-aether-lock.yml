name: Update Aether Android lock

on:
  # Temporary branch-only lock generation; removed after lock hashes commit.
  push:
    branches: [fix/aether-v240-fallbacks-20261024]
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed upstream stable tag, e.g. v2.3.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  pin-android:
    if: github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Derive and pin native hashes from published release
        env:
          REQUESTED_VERSION: ${{ inputs.version || 'v2.4.0' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 android/scripts/update-aether-release.py --version "$REQUESTED_VERSION" --write
          python3 -m py_compile android/scripts/update-aether-release.py
          git diff --check
      - name: Commit the reviewed lock on the feature branch
        env:
          REQUESTED_VERSION: ${{ inputs.version || 'v2.4.0' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- internal/aether/android-cores.json internal/aether/desktop-cores.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update locked Aether artifacts to $REQUESTED_VERSION"
            git push origin HEAD:"$GITHUB_REF"
          fi
